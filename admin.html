<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Адмін-панель — Переселенець</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body><main class="wrap admin"><div class="mobile-top"><strong>📱 Керування з телефона</strong><span>Адмін-панель</span></div><h1>Адмін-панель «Переселенець»</h1><div id="login"><p>Увійдіть для керування магазином.</p><input id="pass" type="password" placeholder="Пароль адміністратора"><button class="btn" onclick="login()">Увійти</button><p>Перший запуск: змініть ADMIN_PASSWORD у змінних середовища.</p></div><div id="app" class="hidden"><p><a href="/">← До магазину</a> · <button onclick="logout()">Вийти</button></p><div class="admin-head"><div><h2>Товари</h2><p class="muted">Додавайте товари прямо зі смартфона.</p></div><button class="btn secondary" type="button" onclick="resetForm()">＋ Новий товар</button></div><form id="productForm"><input id="id" type="hidden"><input id="name" placeholder="Назва" required><textarea id="description" placeholder="Опис"></textarea><input id="price" type="number" placeholder="Ціна, грн" required><input id="stock" type="number" placeholder="Залишок"><input id="image" placeholder="URL фото або завантажте нижче"><input id="file" type="file" accept="image/*" capture="environment"><label><input id="active" type="checkbox" checked> Показувати товар</label><br><button class="btn">Зберегти товар</button> <button type="button" onclick="resetForm()">Очистити</button></form><hr><div id="products"></div><h2>Замовлення</h2><div id="orders"></div></div></main><script>let token=localStorage.getItem('ptoken');const $=s=>document.querySelector(s);async function login(){let p=$('#pass').value,r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});if(r.ok){let d=await r.json();token=d.token;localStorage.setItem('ptoken',token);show()}else alert('Невірний пароль')}async function logout(){try{await api('/api/admin/logout',{method:'POST'})}catch(e){}localStorage.removeItem('ptoken');location.reload()}function show(){if(!token)return;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};const r=await fetch(url,opt);if(r.status===401){localStorage.removeItem('ptoken');token=null;location.reload();throw new Error('Сесія завершилася')}return r}async function load(){let ps=await api('/api/admin/products').then(r=>r.json());$('#products').innerHTML=ps.map(p=>`<div class="card product-admin"><div class="product-admin-main">${p.image?`<img src="${p.image}" alt="" class="admin-thumb">`:''}<div><b>${p.name}</b><div class="muted">${p.price} грн · залишок ${p.stock} · ${p.active?'активний':'прихований'}</div></div></div><div class="actions"><button class="btn small" onclick='edit(${JSON.stringify(p)})'>Редагувати</button><button class="btn small danger" onclick='del(${p.id})'>Видалити</button></div></div>`).join('');let os=await api('/api/admin/orders').then(r=>r.json());$('#orders').innerHTML=os.map(o=>`<div class="card" style="margin:12px 0"><b>#${o.id}</b> ${o.name}, ${o.phone}<br>${o.city_branch}<br>${o.items} <b>${o.total} грн</b><br><select onchange="status(${o.id},this.value)"><option ${o.status==='Нове'?'selected':''}>Нове</option><option ${o.status==='В обробці'?'selected':''}>В обробці</option><option ${o.status==='Відправлено'?'selected':''}>Відправлено</option><option ${o.status==='Завершено'?'selected':''}>Завершено</option></select></div>`).join('')}function edit(p){['id','name','description','price','stock','image'].forEach(k=>$('#'+k).value=p[k]);$('#active').checked=!!p.active;scrollTo(0,0)}function resetForm(){$('#productForm').reset();$('#id').value='';$('#active').checked=true}async function del(id){if(confirm('Видалити товар?')){await api('/api/admin/products/'+id,{method:'DELETE'});load()}}async function status(id,status){await api('/api/admin/orders/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})})}$('#productForm').onsubmit=async e=>{e.preventDefault();let image=$('#image').value;let file=$('#file').files[0];if(file){let fd=new FormData();fd.append('image',file);let rr=await api('/api/admin/upload',{method:'POST',body:fd});let d=await rr.json();image=d.url}let body={name:$('#name').value,description:$('#description').value,price:$('#price').value,stock:$('#stock').value,image,active:$('#active').checked};let id=$('#id').value;await api(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});resetForm();load()};show();</script></body></html>
